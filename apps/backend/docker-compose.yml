version: '3.8' 
services: 
  db: 
    image: postgres:15-alpine 
    container_name: tribunal-postgres 
    ports: 
      - "5432:5432" 
    environment: 
      POSTGRES_USER: root 
      POSTGRES_PASSWORD: password123 
      POSTGRES_DB: tribunal 
    volumes: 
      - pgdata:/var/lib/postgresql/data 
 
  redis: 
    image: redis:7-alpine 
    container_name: tribunal-redis 
    ports: 
      - "6379:6379" 
 
volumes: 
  pgdata: 
